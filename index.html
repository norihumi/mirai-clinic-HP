<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiraiClinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- =========================================
        ヘッダー
    ========================================== -->
    <header class="header">
        <div class="header__inner">
            <!-- ロゴ　-->
            <h1 class="header__logo">
                <a href="index.html">
                    Miraiクリニック
                </a>
            </h1>

            <!-- デスクトップ用ナビゲーション / スマホ用メニュー -->
            <nav class="header__nav js-nav">
                <ul class="header__list">
                    <li class="header__item">
                        <a href="index.html">
                            ホーム
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="concept.html">
                            当院について
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="service.html">
                            診療案内
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="access.html">
                            交通アクセス
                        </a>
                    </li>
                    <li class="header__item header__item_cta">
                        <a href="contact.html">
                            Web予約・お問い合わせ
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- スマホ用ハンバーガーボタン -->
            <button type="button" class="header__hamburger js-hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>

        <!-- =========================================
            メインビジュアル
        ========================================== -->
        <section class="top-mv">
            <div class="top-mv__inner">
                <div class="top-mv__content">
                    <h1 class="top-mv__title">
                        キャッチコピーが<br>ここに入ります
                    </h1>
                    <p class="top-mv__text">
                        サブテキストや補足説明の文章をここに記述します。
                    </p>
                </div>
            </div>
        </section>

        <!-- =========================================
            コンセプト
        ========================================== -->
        <section class="top-concept section">
            <div class="top-concept__inner inner">
                <div class="title">
                    <h2 class="title__main">
                        CONCEPT
                    </h2>
                    <p class="title__sub"> 
                        当院について
                    </p>
                </div>

                <div class="top-concept__content">
                    <div class="top-concept__img">
                        <img src="img/concept-img.jpg" alt="診療を行う医師の様子">
                    </div>
                    <div class="top-concept__textbox">
                        <h3 class="top-concept__catch">
                            地域の皆さまに寄り添う、<br>安心と信頼の医療を。
                        </h3>
                        <p class="top-concept__text">
                            Miraiクリニックでは、患者様一人ひとりの不安に耳を傾け、最適な医療をご提案いたします。最新の設備と温かみのある空間で、ご家族皆様の健康をサポートいたします。
                        </p>
                    </div>
                </div>

                <div class="btn__wrapper">
                    <a href="concept.html" class="btn">
                        詳しく見る
                    </a>
                </div>
            </div>
        </section>

    </main>

    <script src="js/main.js"></script>

</body>
</html>
