<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | Mirai Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- =========================================
        ヘッダー
    ========================================== -->
    <header class="header">
        <div class="header__inner">
            <!-- ロゴ　-->
            <h1 class="header__logo">
                <a href="index.html">
                    Miraiクリニック
                </a>
            </h1>

            <!-- デスクトップ用ナビゲーション / スマホ用メニュー -->
            <nav class="header__nav js-nav">
                <ul class="header__list">
                    <li class="header__item">
                        <a href="index.html">
                            ホーム
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="concept.html">
                            当院について
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="service.html">
                            診療案内
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="access.html">
                            交通アクセス
                        </a>
                    </li>
                    <li class="header__item header__item_cta">
                        <a href="contact.html">
                            Web予約・お問い合わせ
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- スマホ用ハンバーガーボタン -->
            <button type="button" class="header__hamburger js-hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>

        <!-- =========================================
            メインビジュアル
        ========================================== -->
        <section class="contact-mv page-mv">
            <div class="inner">
                <h1 class="page-mv__title">
                    <span class="en">
                        CONTACT
                    </span>
                    <span class="ja">
                        お問い合わせ
                    </span>
                </h1>
            </div>
        </section>

        <!-- =========================================
            パンくずリスト
        ========================================== -->
        <nav class="page-breadcrumb" aria-label="パンくずリスト">
            <div class="inner">
                <ol class="page-breadcrumb__list">
                    <li class="page-breadcrumb__item">
                        <a href="index.html">
                            HOME
                        </a>
                    </li>
                    <li class="page-breadcrumb__item" aria-current="page">
                        お問い合わせ
                    </li>
                </ol>
            </div>
        </nav>

        <!-- =========================================
            お問い合わせフォーム
        ========================================== -->
        <section class="contact-section section">
            <div class="inner">
                <h2 class="page-title">
                    <span class="page-title__en">
                        FORM
                    </span>
                    <span class="page-title__ja">
                        入力フォーム
                    </span>
                </h2>
                <p class="contact-form__text">
                    診療に関するご質問やご相談は、下記フォームよりお気軽にお問い合わせください。<br>
                    ※お急ぎの場合は、お電話（03-1234-5678）にてご連絡をお願いいたします。
                </p>

                <!-- フォーム本体 -->
                <form action="#" method="post" class="contact-form">
                    <dl class="contact-form__list">
                        <!-- お名前 -->
                        <div class="contact-form__item">
                            <dt class="contact-form__label">
                                <label for="name">
                                    お名前
                                </label>
                                <span class="contact-form__badge">
                                    必須
                                </span>
                            </dt>
                            <dd class="contact-form__input">
                                <input type="text" id="name" name="name" placeholder="山田 太郎" required>
                            </dd>
                        </div>

                        <!-- フリガナ -->
                        <div class="contact-form__item">
                            <dt class="contact-form__label">
                                <label for="kana">
                                    フリガナ
                                </label>
                                <span class="contact-form__badge">
                                    必須
                                </span>
                            </dt>
                            <dd class="contact-form__input">
                                <input type="text" id="kana" name="kana" placeholder="ヤマダ タロウ" required>
                            </dd>
                        </div>

                        <!-- メールアドレス -->
                        <div class="contact-form__item">
                            <dt class="contact-form__label">
                                <label for="email">
                                    メールアドレス
                                </label>
                                <span class="contact-form__badge">
                                    必須
                                </span>
                            </dt>
                            <dd class="contact-form__input">
                                <input type="email" id="email" name="email" placeholder="example@clinic.com" required>
                            </dd>
                        </div>

                        <!-- 電話番号 -->
                        <div class="contact-form__item">
                            <dt class="contact-form__label">
                                <label for="tel">
                                    電話番号
                                </label>
                                <span class="contact-form__badge contact-form__badge_optional">
                                    任意
                                </span>
                            </dt>
                            <dd class="contact-form__input">
                                <input type="tel" id="tel" name="tel" placeholder="090-0000-0000">
                            </dd>
                        </div>

                        <!-- お問い合わせ内容 -->
                        <div class="contact-form__item">
                            <dt class="contact-form__label">
                                <label for="message">
                                    お問い合わせ内容
                                </label>
                                <span class="contact-form__badge">
                                    必須
                                </span>
                            </dt>
                            <dd class="contact-form__input">
                                <textarea id="message" name="message" rows="6" placeholder="ご質問・ご相談内容をご記入ください" required>
                                </textarea>
                            </dd>
                        </div>
                    </dl>

                    <!-- 送信ボタン -->
                    <div class="contact-form__btn_wrap">
                        <button type="submit" class="contact-form__btn">
                            送信する
                        </button>
                    </div>
                </form>

            </div>
        </section>

    </main>

    <!-- =========================================
        フッター
    ========================================== -->
    <footer class="footer">
        <div class="footer__inner inner">
            <p class="footer__logo">
                Miraiクリニック
            </p>
            <p class="footer__copyright">
                &copy; 2026 Miraiクリニック. All Rights Reserved.
            </p>
        </div>
    </footer>

    <script src="js/main.js"></script>

</body>
</html>
